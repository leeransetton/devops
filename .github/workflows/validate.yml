name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  opentofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false
      - run: tofu validate

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Lint shared chart
        run: helm lint charts/web-app --set image.repository=x,image.tag=y,hosts[0]=example.com
      - name: Build and validate kustomizations
        run: |
          set -euo pipefail
          for dir in infrastructure/controllers infrastructure/configs apps; do
            echo "::group::$dir"
            kubectl kustomize "$dir" | kubeconform -strict -ignore-missing-schemas -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

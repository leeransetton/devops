apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ghcr-pull.sops.yaml # GHCR pull credentials, generated by scripts/new-project.sh
  - release.yaml
  - image.yaml
  # - secrets.sops.yaml # app env vars, see CLAUDE.md "Add or change an app secret"

# values.yaml becomes a ConfigMap the HelmRelease reads.
# The watch label makes Flux redeploy as soon as values change.
configMapGenerator:
  - name: __PROJECT__-values
    namespace: __PROJECT__
    files:
      - values.yaml
    options:
      labels:
        reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true

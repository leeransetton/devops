apiVersion: v1
kind: Namespace
metadata:
  name: __PROJECT__
---
# Caps what one project can take from the shared node.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: __PROJECT__
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 768Mi
    limits.memory: 1536Mi
    persistentvolumeclaims: "3"
    requests.storage: 20Gi
---
# Defaults for any container that doesn't set its own resources.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: __PROJECT__
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        memory: 256Mi
---
# Projects are isolated: only Traefik (and pods in the same namespace) can reach them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-traefik-only
  namespace: __PROJECT__
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - podSelector: {}

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# Names of existing docker-registry secrets in the namespace (for private GHCR images).
imagePullSecrets: []

# Container port the app listens on.
port: 8080

# HTTP path for readiness/liveness probes. Set to "" to disable probes.
healthPath: /

# Public hostnames. Each gets a DNS record (external-dns) and a TLS certificate (cert-manager).
hosts: []

# Plain environment variables.
env: {}

# Name of a Secret whose keys become environment variables.
envFromSecret: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

# Used only when hpa.enabled is false.
replicas: 1

hpa:
  enabled: true
  min: 1
  max: 3
  cpu: 80

# Persistent volumes (DigitalOcean block storage, ReadWriteOnce).
# Any volume forces 1 replica, disables HPA and uses the Recreate strategy.
# - name: data
#   size: 1Gi
#   mountPath: /data
#   storageClass: do-block-storage-retain  # default; "-xfs-retain" for XFS
volumes: []

# Pod-level securityContext, e.g. {fsGroup: 1000} so a non-root app can write to its volumes.
podSecurityContext: {}

# Writes new image tags into apps/*/values.yaml (lines marked with $imagepolicy)
# and pushes the commit to main.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: "chore(images): update image tags"
    push:
      branch: main
  update:
    path: ./apps
    strategy: Setters

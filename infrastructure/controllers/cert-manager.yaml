apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.3"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi

# Namespace and the DO token secret are created by OpenTofu (terraform/flux.tf).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      # TODO: pin to the installed version after the first successful install.
      version: ">=1.15.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  values:
    provider:
      name: digitalocean
    env:
      - name: DO_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-digitalocean
            key: token
    sources:
      - ingress
    domainFilters:
      - leeransetton.com
      - sqloutputtojson.com
      - gamadanak.com
    # sync = also delete records when an Ingress is removed.
    # Only records owned by this cluster (TXT marker) are touched, so MX etc. are safe.
    policy: sync
    txtOwnerId: side-projects
    interval: 1m
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
